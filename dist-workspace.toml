[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# The man page and shell completions go in every archive, beside the binary
# (README, LICENSE and CHANGELOG are included anyway).
include = ["assets/man/irsty.1", "assets/completions/"]
# The Homebrew formula (prebuilt binaries for macOS and Linux) is pushed to
# this tap on each release, with the HOMEBREW_TAP_TOKEN secret.
tap = "gawbul/homebrew-tap"
publish-jobs = ["homebrew"]

# Pin the actions dist's workflow uses to the commits of their latest
# releases (dist writes them without a version comment, so the versions are
# here): checkout v7.0.1, upload-artifact v7.0.2, download-artifact v8.0.2,
# rust-cache v2.9.3. Update with the other pins in .github/workflows/.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9"
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333"
"swatinem/rust-cache" = "d1527c8f67ef9af357290475d4af4b0fab8f12e0"

# The Linux archives are still built on Ubuntu 22.04 (dist's default), so
# they need glibc 2.35, not 24.04's 2.39, and run on more distributions. The
# jobs that build nothing (plan, host, Homebrew, announce) use the current
# image.
[dist.github-custom-runners]
global = "ubuntu-latest"
