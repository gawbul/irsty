[package]
name = "irsty-core"
description = "Connection management and client state for Irsty, free of UI dependencies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bytes = "1.12.1"
directories = "6.0.0"
futures = "0.3.34"
irsty-proto.workspace = true
jiff = "0.2.38"
keyring = "4.2.0"
regex = "1.13.1"
rustls-pki-types = "1.15.1"
rustls-platform-verifier = "0.7.1"
rustls-webpki = { version = "0.103.16", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "net", "time", "sync", "macros", "io-util", "process"] }
tokio-rustls = "0.26.6"
tokio-util = { version = "0.7.20", features = ["codec"] }
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "test-util"] }
