[package]
name = "irsty-tui"
description = "Terminal user interface for Irsty, built on ratatui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3.34"
irsty-core.workspace = true
irsty-proto.workspace = true
jiff = "0.2.38"
ratatui = "0.30.2"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "signal"] }
tracing = "0.1.44"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"

[lints]
workspace = true

[target."cfg(unix)".dependencies]
signal-hook = "0.4.5"

[dev-dependencies]
criterion = "0.8.2"
insta = "1.49.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
