[package]
name = "irsty"
description = "A modern, keyboard-driven terminal IRC client"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "cargo", "wrap_help"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
color-eyre = "0.6.5"
irsty-core.workspace = true
irsty-proto.workspace = true
irsty-tui.workspace = true
jiff = "0.2.38"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# Released by dist even though it isn't published to crates.io.
[package.metadata.dist]
dist = true

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
