[package]
name = "irsty-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Kept out of the main workspace: fuzzing needs nightly.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4.13"
irsty-proto = { path = "../crates/irsty-proto" }

[[bin]]
name = "parse_message"
path = "fuzz_targets/parse_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "styled_text"
path = "fuzz_targets/styled_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "negotiation"
path = "fuzz_targets/negotiation.rs"
test = false
doc = false
bench = false
