[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
authors = ["Steve Moss <gawbul@gmail.com>"]
repository = "https://github.com/gawbul/irsty"
keywords = ["irc", "ircv3", "tui", "ratatui", "chat"]
categories = ["command-line-utilities", "network-programming"]

[workspace.dependencies]
irsty-proto = { path = "crates/irsty-proto", version = "0.1.0" }
irsty-core = { path = "crates/irsty-core", version = "0.1.0" }
irsty-tui = { path = "crates/irsty-tui", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Documented exceptions to pedantic; see CONTRIBUTING.md.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
assert_is_empty = "allow"
# Extra restriction lints worth having.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
