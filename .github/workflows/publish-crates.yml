name: Publish crates

# Publishes the four crates to crates.io, in dependency order, once the
# Release workflow (generated by dist) has succeeded for a version tag. It is a
# separate workflow, not a dist publish job, because dist 0.34.0 writes an
# invalid `uses:` path for custom jobs, and because crates.io trusted
# publishing is configured against this file.
#
# Authentication is trusted publishing (OIDC). crates.io can't trust a
# workflow for a crate that doesn't exist yet, so the first release uses a
# crates.io API token stored as the CARGO_REGISTRY_TOKEN secret of the
# "crates-io" environment; delete it once trusted publishing is set up
# (docs/PACKAGING.md).

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions: {}

jobs:
  publish:
    # Only a successful Release run for a pushed tag in this repository, and
    # not a prerelease (a version with a hyphen, such as v0.2.0-rc.1).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      !contains(github.event.workflow_run.head_branch, '-')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Authenticate with trusted publishing
        id: auth
        if: env.CARGO_REGISTRY_TOKEN == ''
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: cargo publish --workspace --locked
