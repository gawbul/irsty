name: Packaging

# Builds and installs the distribution packages: the AUR package in Arch
# Linux, the Nix flake on Linux and macOS, and the Scoop manifest on Windows.
# It runs when the packaging or the dependencies change, rather than on every
# pull request, as each job builds Irsty from scratch.

on:
  pull_request:
    paths: &paths
      - packaging/**
      - flake.nix
      - flake.lock
      - Cargo.lock
      - scripts/aur.sh
      - scripts/scoop-manifest.sh
      - .github/workflows/packaging.yml
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aur:
    name: AUR (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Builds the release named in the PKGBUILD from its tarball, with the
      # protocol tests, then runs namcap and checks .SRCINFO is current.
      - run: ./scripts/aur.sh

  nix:
    name: Nix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # Builds this checkout (with the protocol tests and a version check).
      - run: nix flake check --print-build-logs
      - run: nix run . -- --version

  scoop:
    name: Scoop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The manifest for the latest release, as publish-scoop.yml writes it.
      - name: Write the manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --json tagName --jq .tagName)
          gh release download "$tag" --pattern irsty-x86_64-pc-windows-msvc.zip.sha256 --output archive.sha256
          ./scripts/scoop-manifest.sh "${tag#v}" "$(cut -d' ' -f1 archive.sha256)" > irsty.json
          cat irsty.json
      - name: Install with Scoop
        shell: pwsh
        run: |
          Invoke-Expression "& {$(Invoke-RestMethod https://get.scoop.sh)} -RunAsAdmin"
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop install .\irsty.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          irsty --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
