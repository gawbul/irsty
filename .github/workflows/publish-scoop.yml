name: Publish Scoop manifest

# Pushes bucket/irsty.json to gawbul/scoop-bucket once the Release workflow
# (generated by dist) has succeeded for a version tag, so that
# `scoop install gawbul/irsty` installs the new release. dist has no Scoop
# installer, so this is ours. It pushes with SCOOP_BUCKET_TOKEN, a
# fine-grained token with read and write access to the bucket's contents only,
# stored in the scoop-bucket environment (docs/PACKAGING.md).
#
# It can also be run by hand for an existing release, to publish or repair
# its manifest: `gh workflow run publish-scoop.yml -f tag=v0.1.0`. The same
# checks and approval apply.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish, such as v0.1.0
        required: true
        type: string

permissions: {}

jobs:
  publish:
    # Run by hand, or after a successful run of release.yml (not just any
    # workflow named Release) for a tag pushed to this repository. The tag
    # itself is checked in the first steps.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.path == '.github/workflows/release.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # SCOOP_BUCKET_TOKEN belongs to this environment, which requires an
    # approval, so no other job can read it (docs/PACKAGING.md).
    environment: scoop-bucket
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      # main, not the release commit: the scripts run from main's copy, never
      # from the commit being checked.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Find the release commit
        id: release
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch ]]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: $TAG"; exit 1; }
            sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          else
            sha=$RUN_SHA
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check the tag
        env:
          HEAD_SHA: ${{ steps.release.outputs.sha }}
        run: ./scripts/check-release-tag.sh
      - name: Write the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern irsty-x86_64-pc-windows-msvc.zip.sha256 --output archive.sha256
          hash=$(cut -d' ' -f1 archive.sha256)
          ./scripts/scoop-manifest.sh "${TAG#v}" "$hash" > irsty.json
          cat irsty.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gawbul/scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: scoop-bucket
      - name: Push to the bucket
        run: |
          set -euo pipefail
          mkdir -p scoop-bucket/bucket
          cp irsty.json scoop-bucket/bucket/irsty.json
          cd scoop-bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/irsty.json
          if git diff --cached --quiet; then
            echo "bucket/irsty.json is already $TAG"
          else
            git commit -m "irsty ${TAG#v}"
            git push
          fi
